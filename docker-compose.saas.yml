name: ragsystem-saas

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - ragsystem-saas-object-storage:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "until mc alias set local http://minio:9000 ${OBJECT_STORAGE_ACCESS_KEY_ID:-minioadmin} ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-minioadmin}; do sleep 1; done;
      mc mb --ignore-existing local/${OBJECT_STORAGE_BUCKET:-ragsystem}"

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ragsystem
      POSTGRES_USER: ragsystem
      POSTGRES_PASSWORD: ragsystem
    volumes:
      - ragsystem-saas-postgres:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragsystem -d ragsystem"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  sandbox-runtime:
    build:
      context: ./sandbox-service/runtime
      dockerfile: Dockerfile
    image: ragsystem-sandbox-runtime:local
    command: ["/bin/true"]
    restart: "no"

  sandbox:
    build:
      context: .
      dockerfile: sandbox-service/Dockerfile
    environment:
      SANDBOX_API_TOKEN: ${SANDBOX_REMOTE_TOKEN:?SANDBOX_REMOTE_TOKEN must be set}
      SANDBOX_RUNTIME_IMAGE: ragsystem-sandbox-runtime:local
      SANDBOX_DOCKER_RUNTIME: ${SANDBOX_DOCKER_RUNTIME:-}
      SANDBOX_MEMORY: ${SANDBOX_MEMORY:-1g}
      SANDBOX_CPUS: ${SANDBOX_CPUS:-1}
      SANDBOX_PIDS_LIMIT: ${SANDBOX_PIDS_LIMIT:-128}
      SANDBOX_MAX_ACTIVE_LEASES: ${SANDBOX_MAX_ACTIVE_LEASES:-8}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      # The control plane owns the Docker socket. Keep its debug endpoint local;
      # the backend reaches it through the private Compose network.
      - "127.0.0.1:${SANDBOX_SERVICE_PORT:-5013}:5003"
    depends_on:
      sandbox-runtime:
        condition: service_completed_successfully
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend-ts/Dockerfile
    environment:
      BACKEND_TS_HOST: 0.0.0.0
      BACKEND_TS_PORT: 5002
      BACKEND_TS_LOG_LEVEL: ${BACKEND_TS_LOG_LEVEL:-info}
      RAG_DATA_ROOT: /data
      DEPLOYMENT_MODE: saas
      AUTH_MODE: password
      TENANCY_MODE: multi
      EXECUTION_MODE: remote
      STORAGE_MODE: postgres
      # SaaS blobs are external to PostgreSQL. Provide an S3/MinIO transport
      # in the composition root before starting the backend.
      OBJECT_STORAGE_MODE: ${OBJECT_STORAGE_MODE:-s3}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-ragsystem}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-http://minio:9000}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-minioadmin}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-minioadmin}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-true}
      # SaaS Control, Bot, Widget and Identity state are PostgreSQL-backed.
      # Override only when running an explicitly local-compatible composition.
      CONTROL_STORAGE_MODE: ${CONTROL_STORAGE_MODE:-postgres}
      UI_MODE: saas
      DATABASE_URL: ${DATABASE_URL:-postgres://ragsystem:ragsystem@postgres:5432/ragsystem}
      CONTROL_DATABASE_URL: ${CONTROL_DATABASE_URL:-postgres://ragsystem:ragsystem@postgres:5432/ragsystem}
      CONTROL_SECRET_MASTER_KEY: ${CONTROL_SECRET_MASTER_KEY:?CONTROL_SECRET_MASTER_KEY must be set to a base64-encoded 32-byte key}
      POSTGRES_POOL_MAX: ${POSTGRES_POOL_MAX:-10}
      SESSION_JWT_SECRET: ${SESSION_JWT_SECRET:?SESSION_JWT_SECRET must be set}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      SANDBOX_REMOTE_URL: http://sandbox:5003
      SANDBOX_REMOTE_TOKEN: ${SANDBOX_REMOTE_TOKEN:?SANDBOX_REMOTE_TOKEN must be set}
      SANDBOX_REQUEST_TIMEOUT_MS: ${SANDBOX_REQUEST_TIMEOUT_MS:-30000}
      SANDBOX_LEASE_TIMEOUT_SECONDS: ${SANDBOX_LEASE_TIMEOUT_SECONDS:-900}
      # Plain HTTP is limited to this single-host Docker development composition.
      SANDBOX_ALLOW_INSECURE_HTTP: "true"
    volumes:
      - ragsystem-saas-data:/data
    ports:
      - "${SAAS_BACKEND_PORT:-5002}:5002"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      sandbox:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend-client/Dockerfile
    ports:
      - "${SAAS_FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ragsystem-saas-data:
  ragsystem-saas-postgres:
  ragsystem-saas-object-storage:
