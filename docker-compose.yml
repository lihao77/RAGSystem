services:
  backend:
    build:
      context: .
      dockerfile: backend-ts/Dockerfile
    container_name: ragsystem-backend
    environment:
      BACKEND_TS_HOST: 0.0.0.0
      BACKEND_TS_PORT: 5002
      RAG_DATA_ROOT: /data
    volumes:
      - ragsystem-data:/data
    ports:
      - "5002:5002"
    restart: unless-stopped

  frontend:
    build: ./frontend-client
    container_name: ragsystem-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ragsystem-data:
