<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>前端工具 MCP 桥接 demo</title>
  <style>
    body { margin: 0; padding: 32px; background: #f5f5f7; color: #1d1d1f; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    h3 { font-size: 14px; margin: 0 0 12px; color: #6e6e73; }
    p { line-height: 1.7; margin: 8px 0; }
    .panel { background: #fff; border-radius: 12px; padding: 18px 20px; margin: 14px 0; box-shadow: 0 1px 3px rgba(0,0,0,.08); max-width: 680px; }
    input, button { font: inherit; padding: 7px 12px; border-radius: 8px; border: 1px solid #d2d2d7; }
    button { cursor: pointer; }
    .btn { background: #0071e3; color: #fff; border: none; }
    #log { white-space: pre-wrap; font-family: ui-monospace, "SF Mono", monospace; font-size: 12px; color: #515154; max-height: 160px; overflow: auto; background: #f5f5f7; padding: 8px 10px; border-radius: 8px; }
    code { background: #e8e8ed; padding: 1px 6px; border-radius: 4px; font-size: 13px; }
    #status { font-size: 14px; }
  </style>
</head>
<body>
  <h1>前端工具 MCP 桥接 demo</h1>
  <p>widget 是消息入口（右下角浮动按钮）；DOM 工具经独立 MCP server 路由——agent 调 <code>mcp__frontend-tools__click</code> 等会操作本页元素。</p>

  <div class="panel">
    <h3>可交互元素（供 agent 经 MCP 操作演示）</h3>
    <p>按钮：<button id="demo-btn" class="btn" onclick="btnClick()">点我</button> <span id="btn-result">未点击</span></p>
    <p>输入框：<input id="demo-input" value="hello" /> （让 agent 读/改这个值）</p>
    <p>文本：<span id="demo-text">这是一段示例文本 ABC</span> （让 agent get_text）</p>
    <form id="demo-form" onsubmit="event.preventDefault(); log('表单已提交')">
      <p>表单：<input id="form-input" placeholder="表单字段" /> <button type="submit" class="btn">提交</button></p>
    </form>
  </div>

  <div class="panel">
    <h3>桥接状态</h3>
    <div id="status">初始化…</div>
    <div id="log"></div>
  </div>

  <!-- 三个 UMD：host-tools（DOM 工具集）→ mcp-client（执行端）→ widget（消息入口）-->
  <script src="/host-tools.js"></script>
  <script src="/mcp-client.js"></script>
  <script src="/widget.js"></script>
  <script>
    const BACKEND = "{{BACKEND}}";
    const MCP_WS = "{{MCP_WS}}";
    const logEl = document.getElementById("log");
    const statusEl = document.getElementById("status");
    const log = (m) => { logEl.textContent += m + "\n"; logEl.scrollTop = logEl.scrollHeight; };
    const setStatus = (h) => { statusEl.innerHTML = h; };
    function btnClick() {
      document.getElementById("btn-result").textContent = "已点击 @ " + new Date().toLocaleTimeString();
    }

    // widget 懒建 session：onSessionChange 回调把 session_id 传给页面，据此（重）注册 MCP 执行端。
    // newSession 时回调收 null → 断开旧执行端；下次发消息建新会话 → 回调再触发注册。
    let mcpClient = null;
    let mcpSession = null;
    function handleSession(sid) {
      if (sid === mcpSession) return; // 去重：同 session 不重连
      if (mcpClient) { mcpClient.disconnect(); mcpClient = null; }
      mcpSession = sid;
      if (!sid) {
        log("session 已丢弃（新对话），MCP 执行端已断开");
        setStatus("widget 已开新对话 — 发首条消息后自动建新会话并重新注册 MCP 执行端");
        return;
      }
      mcpClient = new RagMcpClient.RagMcpClient({ url: MCP_WS, sessionId: sid });
      mcpClient.registerTools(RagHostTools.dom.BUILTIN_TOOLS);
      mcpClient.connect();
      log(`session ${sid.slice(0, 8)} 已向 MCP server 注册 ${RagHostTools.dom.BUILTIN_TOOLS.length} 个 DOM 工具`);
      setStatus(
        `✅ 就绪 — session <code>${sid.slice(0, 8)}</code>。对 widget 说：` +
        `<br>·「点击页面按钮」<br>·「读取输入框的值」<br>·「把输入框的值改成 MCP」` +
        `<br>agent 经 <code>mcp__frontend-tools__*</code> → MCP server → 本页执行。`
      );
    }

    async function main() {
      if (!window.RagWidget || !window.RagMcpClient || !window.RagHostTools) {
        setStatus("❌ UMD 未全部加载（widget/mcp-client/host-tools），请确认已 build 并刷新");
        return;
      }
      try {
        // widget 懒建 session：首次发消息时建会话，经 onSessionChange 把 session_id 回调给页面注册 MCP
        await window.RagWidget.mount({ backendBase: BACKEND, onSessionChange: handleSession, publishableKey: 'wid_pk_b203a6d76cdc38d7ee951fbc94190d1cda580075e009f4be'});
        log("widget 已挂载（消息入口，懒建 session）");
        setStatus("widget 已挂载 — 首次发消息后自动建会话并注册 MCP 执行端");
      } catch (e) {
        setStatus("❌ " + (e.message || e));
        console.error(e);
      }
    }
    main();
  </script>
</body>
</html>
