<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>委托模式 Demo · 接入真实后端</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #1a1a1a; color: #e0e0e0; margin: 0; padding: 14px; }
  h1 { font-size: 17px; margin: 0 0 10px; }
  .hint { font-size: 12px; color: #888; margin-bottom: 10px; line-height: 1.5; }
  .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  input, button { padding: 6px 10px; border-radius: 4px; border: 1px solid #444; background: #2a2a2a; color: #e0e0e0; font-size: 13px; }
  button { cursor: pointer; background: #3a5a8a; border-color: #5a7aaa; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .status { font-size: 12px; color: #6a6; font-family: monospace; }
  .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; height: calc(100vh - 200px); min-height: 360px; }
  .panel { background: #222; border: 1px solid #333; border-radius: 6px; display: flex; flex-direction: column; overflow: hidden; }
  .panel h2 { font-size: 12px; margin: 0; padding: 7px 12px; background: #2a2a2a; border-bottom: 1px solid #333; letter-spacing: .5px; }
  .panel .body { flex: 1; overflow-y: auto; padding: 8px 12px; font-size: 13px; }
  .msg { margin-bottom: 8px; padding: 7px 10px; border-radius: 4px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { background: #2d3a5a; }
  .msg.assistant { background: #2a3a2a; }
  .msg .role { font-size: 11px; color: #888; margin-bottom: 3px; }
  .log-entry { font-family: ui-monospace, monospace; font-size: 12px; margin-bottom: 4px; padding: 4px 8px; border-left: 2px solid #555; white-space: pre-wrap; word-break: break-word; }
  .log-entry.delegate { border-color: #d4a843; background: #3a3220; color: #ffd87a; }
  .log-entry.tool { border-color: #5a8a5a; color: #9dda9d; }
  .log-entry.run { border-color: #6a6; }
  .composer { display: flex; gap: 8px; margin-top: 10px; }
  .composer input { flex: 1; }
</style>
</head>
<body>
<h1>🤝 委托模式 Demo — 接入真实后端</h1>
<div class="hint">
  连接 → 自动注册前端工具 <code>get_client_env</code> → 提问引导 agent 调用它（如"我的浏览器语言和时区是什么"）。<br>
  右侧日志高亮 <span style="color:#ffd87a">委托链路</span>：tools.register → tool_call(delegation) → 前端执行 → tool_result 回传。
</div>
<div class="bar">
  <label>后端地址</label>
  <input id="host" value="http://localhost:5002" style="width:230px">
  <button id="connectBtn">连接</button>
  <span class="status" id="status">未连接</span>
</div>
<div class="panels">
  <div class="panel"><h2>对话</h2><div class="body" id="chat"></div></div>
  <div class="panel"><h2>事件 / 委托日志</h2><div class="body" id="log"></div></div>
</div>
<div class="composer">
  <input id="input" placeholder="问：我的浏览器语言和时区是什么？" disabled>
  <button id="sendBtn" disabled>发送</button>
</div>

<script>
// 前端宿主委托工具声明（tools.register 用，wire 格式：input_schema/risk_level，不含 execute）
const HOST_TOOLS = [{
  name: 'get_client_env',
  description: '获取前端客户端环境信息（时区、语言、浏览器 UA、屏幕分辨率等客户端独有数据）。需要用户客户端环境上下文（如本地化、展示适配）时调用。',
  input_schema: { type: 'object', properties: {}, additionalProperties: false },
  risk_level: 'low',
}];

// 前端工具执行（用浏览器独有能力，后端无法执行——这正是委托的价值）
async function executeHostTool(name) {
  if (name === 'get_client_env') {
    return { ok: true, observation: JSON.stringify({
      language: navigator.language,
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
      userAgent: navigator.userAgent,
      screen: `${screen.width}x${screen.height}`,
    }, null, 2) };
  }
  return { ok: false, error: `前端未注册工具: ${name}` };
}

const $ = (id) => document.getElementById(id);
let ws = null, sessionId = null, host = '', currentAssistantEl = null;

function log(text, kind = '') {
  const el = $('log');
  const div = document.createElement('div');
  div.className = 'log-entry ' + kind;
  div.textContent = text;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}
function addMsg(role, content) {
  const el = $('chat');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = `<div class="role">${role === 'user' ? '你' : 'Assistant'}</div><div class="content"></div>`;
  div.querySelector('.content').textContent = content;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
  return div.querySelector('.content');
}
function setStatus(text, ok = true) { $('status').style.color = ok ? '#6a6' : '#a66'; $('status').textContent = text; }
const wsBase = (url) => url.replace(/^http/, 'ws').replace(/\/$/, '');

async function connect() {
  host = $('host').value.trim().replace(/\/$/, '');
  try {
    setStatus('创建会话…');
    const resp = await fetch(`${host}/api/agent/sessions`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}',
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const { data } = await resp.json();
    sessionId = data.session_id;
    setStatus('连接 WS…');
    ws = new WebSocket(`${wsBase(host)}/api/agent/sessions/${sessionId}/ws`);
    ws.onopen = () => {
      setStatus(`已连接 · session ${sessionId.slice(0, 8)}…`);
      $('connectBtn').disabled = true;
      $('input').disabled = false; $('sendBtn').disabled = false; $('input').focus();
      // 握手期注册前端委托工具清单（后端据此判定工具归属 + 委托回前端执行）
      ws.send(JSON.stringify({ type: 'tools.register', session_id: sessionId, payload: { tools: HOST_TOOLS } }));
      log(`→ tools.register：注册 [${HOST_TOOLS.map((t) => t.name).join(', ')}]`, 'delegate');
    };
    ws.onmessage = (e) => { try { handleEnv(JSON.parse(e.data)); } catch (err) { log('解析失败: ' + err.message); } };
    ws.onclose = () => {
      setStatus('连接关闭', false);
      $('connectBtn').disabled = false; $('input').disabled = true; $('sendBtn').disabled = true;
    };
    ws.onerror = () => setStatus('WS 错误', false);
  } catch (err) {
    setStatus('连接失败: ' + err.message, false);
    log('连接失败: ' + err.message);
  }
}

function send() {
  const text = $('input').value.trim();
  if (!text || !ws || ws.readyState !== 1) return;
  addMsg('user', text);
  $('input').value = '';
  currentAssistantEl = null;
  ws.send(JSON.stringify({
    type: 'user_driven_change', session_id: sessionId,
    payload: { category: 'task_submit', task: text, request_id: crypto.randomUUID() },
  }));
}

async function handleEnv(env) {
  const p = env.payload || {};
  switch (env.type) {
    case 'run_started':
      log(`▶ run_started`, 'run'); break;
    case 'stream_output':
      if (p.phase === 'first_token') currentAssistantEl = addMsg('assistant', '');
      else if (p.phase === 'delta' || p.phase === 'final') {
        if (!currentAssistantEl) currentAssistantEl = addMsg('assistant', '');
        if (p.phase === 'final' && p.content) currentAssistantEl.textContent = p.content;
        else if (p.content) currentAssistantEl.textContent += p.content;
      }
      break;
    case 'tool_call':
      if (p.mode === 'delegation' && p.phase === 'request') {
        log(`← 委托请求：${p.tool}（后端→前端执行）`, 'delegate');
        const started = Date.now();
        const result = await executeHostTool(p.tool, p.input);
        ws.send(JSON.stringify({
          type: 'tool_result', session_id: sessionId, call_id: env.call_id,
          payload: { mode: 'delegation', phase: 'result', ...result, elapsed_ms: Date.now() - started },
        }));
        log(`→ tool_result 回传：${result.ok ? '✓ ' + (result.observation || '').slice(0, 100) : '✗ ' + result.error}`, 'delegate');
      } else {
        log(`🔧 工具调用（后端执行）：${p.tool}`, 'tool');
      }
      break;
    case 'agent_started':
      log(`🤖 agent_started: ${env.agent_id}${p.display_name ? ` (${p.display_name})` : ''}`); break;
    case 'agent_ended':
      log(`🤖 agent_ended: ${env.agent_id}`); break;
    case 'run_ended':
      log(`■ run_ended: ${p.status}`, 'run'); break;
    case 'error':
      log(`⚠ error: ${p.code || ''} ${p.message || ''}`); break;
    default:
      log(`· ${env.type}`);
  }
}

$('connectBtn').onclick = connect;
$('sendBtn').onclick = send;
$('input').addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
