<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>第三方宿主页（widget demo）</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #f5f5f7;
      color: #1d1d1f;
      font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
      min-height: 100vh;
    }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #6e6e73; line-height: 1.6; }
    code { background: #e8e8ed; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
  </style>
</head>
<body>
  <h1>这是一个模拟的第三方宿主页</h1>
  <p>本页面模拟任意第三方网站（Vue/React/纯 HTML 均可）。widget 已嵌入，右下角可见浮动按钮。</p>
  <p>试着对 widget 说「获取页面标题」——agent 会委托调用宿主页注册的 <code>get_page_title</code> 工具。</p>

  <!-- widget bundle（单文件 umd，宿主只需这一个 script） -->
  <script src="/widget.js"></script>
  <script>
    // 宿主页通过 mount 注入 backendBase/token，并注册自己的业务工具（agent 可委托执行）。
    window.RagWidget.mount({
      backendBase: "{{BACKEND_BASE}}",
      token: "{{TOKEN}}",
      hostTools: [
        {
          name: "get_page_title",
          description: "获取当前宿主页面的标题（document.title）",
          inputSchema: { type: "object", properties: {}, additionalProperties: false },
          riskLevel: "low",
          execute: async () => ({ ok: true, observation: document.title }),
        },
      ],
    }).then((el) => {
      console.log("widget 已挂载", el);
    }).catch((err) => {
      console.error("widget 挂载失败", err);
    });
  </script>
</body>
</html>
