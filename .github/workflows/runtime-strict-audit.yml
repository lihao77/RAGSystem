name: Repository Checks

on:
  pull_request:
    paths:
      - 'backend-ts/**'
      - 'frontend-client/**'
      - 'desktop-electron/**'
      - 'packages/**'
      - 'host-tool-mcp-server/**'
      - 'examples/**'
      - 'package.json'
      - 'package-lock.json'
      - 'README.md'
      - 'README.en.md'
      - 'docs/**'
      - '.github/workflows/runtime-strict-audit.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'backend-ts/**'
      - 'frontend-client/**'
      - 'desktop-electron/**'
      - 'packages/**'
      - 'host-tool-mcp-server/**'
      - 'examples/**'
      - 'package.json'
      - 'package-lock.json'
      - 'README.md'
      - 'README.en.md'
      - 'docs/**'
      - '.github/workflows/runtime-strict-audit.yml'

jobs:
  package-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace dependencies
        run: npm ci
      - name: Check shared packages
        run: npm run check:packages

  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace dependencies
        run: npm ci
      - name: Check TypeScript backend
        run: npm run check:backend

  browser-client-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace dependencies
        run: npm ci
      - name: Check frontend client
        run: npm run check:frontend
      - name: Check agent widget
        run: npm run check:widget

  desktop-backend-checks:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop-electron/package-lock.json
      - name: Install workspace dependencies
        run: npm ci
      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop-electron
      - name: Build and probe desktop backend
        run: npm run build:backend
        working-directory: desktop-electron
