name: Repository Checks

on:
  pull_request:
    paths:
      - 'backend-core/**'
      - 'backend-local/**'
      - 'plugins/**'
      - 'sandbox-service/**'
      - 'scripts/**'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'frontend-client/**'
      - 'desktop-electron/**'
      - 'packages/**'
      - 'host-tool-mcp-server/**'
      - 'examples/**'
      - 'package.json'
      - 'package-lock.json'
      - 'README.md'
      - 'README.en.md'
      - 'docs/**'
      - '.github/workflows/runtime-strict-audit.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'backend-core/**'
      - 'backend-local/**'
      - 'plugins/**'
      - 'sandbox-service/**'
      - 'scripts/**'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'frontend-client/**'
      - 'desktop-electron/**'
      - 'packages/**'
      - 'host-tool-mcp-server/**'
      - 'examples/**'
      - 'package.json'
      - 'package-lock.json'
      - 'README.md'
      - 'README.en.md'
      - 'docs/**'
      - '.github/workflows/runtime-strict-audit.yml'

jobs:
  package-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace dependencies
        run: npm ci
      - name: Check CI backend package coverage
        run: npm run check:ci
      - name: Check shared packages
        run: npm run check:packages

  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace dependencies
        run: npm ci
      - name: Check TypeScript backend
        run: npm run check:backend
      - name: Build TypeScript backend container
        run: docker build --file backend-local/Dockerfile --tag ragsystem-backend:ci .

  browser-client-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace dependencies
        run: npm ci
      - name: Check frontend client
        run: npm run check:frontend
      - name: Run frontend browser smoke
        run: npm -w frontend-client run screenshot:smoke
      - name: Check agent widget
        run: npm run check:widget

  desktop-backend-checks:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop-electron/package-lock.json
      - name: Install workspace dependencies
        run: npm ci
      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop-electron
      - name: Build and probe desktop backend
        run: npm run build:backend
        working-directory: desktop-electron
      - name: Build desktop frontend
        run: npm run build:frontend
        working-directory: desktop-electron
      - name: Smoke test Electron startup
        run: npm run smoke:desktop
        working-directory: desktop-electron
      - name: Build Windows installer
        run: node node_modules/electron-builder/cli.js --win nsis --publish never
        working-directory: desktop-electron
      - name: Smoke test packaged app
        run: npm run smoke:packaged
        working-directory: desktop-electron
