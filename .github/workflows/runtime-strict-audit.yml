name: Repository Checks

on:
  pull_request:
    paths:
      - 'backend-ts/**'
      - 'frontend-client/**'
      - 'desktop-electron/**'
      - 'packages/**'
      - 'host-tool-mcp-server/**'
      - 'examples/**'
      - 'package.json'
      - 'package-lock.json'
      - 'README.md'
      - 'README.en.md'
      - 'docs/**'
      - '.github/workflows/runtime-strict-audit.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'backend-ts/**'
      - 'frontend-client/**'
      - 'desktop-electron/**'
      - 'packages/**'
      - 'host-tool-mcp-server/**'
      - 'examples/**'
      - 'package.json'
      - 'package-lock.json'
      - 'README.md'
      - 'README.en.md'
      - 'docs/**'
      - '.github/workflows/runtime-strict-audit.yml'

jobs:
  package-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.5'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace dependencies
        run: npm ci
      - name: Check shared packages
        run: npm run check:packages

  backend-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ragsystem_test
          POSTGRES_USER: ragsystem
          POSTGRES_PASSWORD: ragsystem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ragsystem -d ragsystem_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ragsystem:ragsystem@127.0.0.1:5432/ragsystem_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.5'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace dependencies
        run: npm ci
      - name: Check TypeScript backend
        run: npm run check:backend
      - name: Build TypeScript backend container
        run: docker build --file backend-local/Dockerfile --tag ragsystem-backend:ci .

  browser-client-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.5'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace dependencies
        run: npm ci
      - name: Check frontend client
        run: npm run check:frontend
      - name: Run frontend browser smoke
        run: npm -w frontend-client run screenshot:smoke
      - name: Check agent widget
        run: npm run check:widget

  desktop-backend-checks:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.5'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop-electron/package-lock.json
      - name: Install workspace dependencies
        run: npm ci
      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop-electron
      - name: Build and probe desktop backend
        run: npm run build:backend
        working-directory: desktop-electron
      - name: Build desktop frontend
        run: npm run build:frontend
        working-directory: desktop-electron
      - name: Smoke test Electron startup
        run: npm run smoke:desktop
        working-directory: desktop-electron
