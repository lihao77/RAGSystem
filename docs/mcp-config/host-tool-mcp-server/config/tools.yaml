# 前端 DOM 工具静态清单（对齐 widget host-tools DOM_TOOLS 7 项；name/input_schema/risk_level 逐项一致）。
# tools/list 永远返回此清单；前端 RagMcpClient 注册同名工具（RagHostTools.dom.builtins），register 时 server 逐工具比对 input_schema。
# 调用时按 tools/call 的 _meta.session_id 路由到对应前端执行；无执行端/schema 不匹配返回软失败提示。
tools:
  - name: click
    description: "点击匹配 selector 的元素。"
    input_schema:
      type: object
      properties:
        selector: { type: string, description: "CSS 选择器" }
      required: [selector]
      additionalProperties: false
    risk_level: medium
  - name: get_text
    description: "读取匹配 selector 元素的文本内容（trim）。"
    input_schema:
      type: object
      properties:
        selector: { type: string, description: "CSS 选择器" }
      required: [selector]
      additionalProperties: false
    risk_level: low
  - name: get_value
    description: "读取输入控件（input/textarea/select）的值。"
    input_schema:
      type: object
      properties:
        selector: { type: string, description: "CSS 选择器（input/textarea/select）" }
      required: [selector]
      additionalProperties: false
    risk_level: low
  - name: set_value
    description: "设置输入控件的值（input/textarea/select，自动派发 input/change 兼容受控组件）。"
    input_schema:
      type: object
      properties:
        selector: { type: string, description: "CSS 选择器（input/textarea/select）" }
        value: { type: string }
      required: [selector, value]
      additionalProperties: false
    risk_level: medium
  - name: scroll_to
    description: "滚动到指定元素（selector）或坐标（x,y）。"
    input_schema:
      type: object
      properties:
        selector: { type: string, description: "CSS 选择器（与 x/y 二选一）" }
        x: { type: number }
        y: { type: number }
      additionalProperties: false
    risk_level: low
  - name: focus
    description: "聚焦匹配 selector 的元素。"
    input_schema:
      type: object
      properties:
        selector: { type: string, description: "CSS 选择器" }
      required: [selector]
      additionalProperties: false
    risk_level: low
  - name: submit
    description: "提交匹配 selector 的表单（优先 requestSubmit，触发 submit 事件）。"
    input_schema:
      type: object
      properties:
        selector: { type: string, description: "CSS 选择器（form 元素）" }
      required: [selector]
      additionalProperties: false
    risk_level: medium
